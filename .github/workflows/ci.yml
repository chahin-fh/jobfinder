name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build-time placeholders. Real values live in the Vercel project settings.
  VITE_SUPABASE_URL: https://ci.supabase.co
  VITE_SUPABASE_ANON_KEY: ci-anon-key-placeholder

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type / Svelte check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
